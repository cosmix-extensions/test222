name: Build CloudStream Plugin

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Generate
        run: |
          # Retries to survive transient GitHub failures such as 504 while
          # the CloudStream gradle plugin downloads classes.jar.
          gradle_retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::Attempt $attempt failed for: $* - retrying in 30s"
              sleep 30
            done
            echo "::error::All 3 attempts failed for: $*"
            return 1
          }

          gradle_retry ./gradlew HamsterProvider:make
          gradle_retry ./gradlew ViralLinksProvider:make
          gradle_retry ./gradlew WowProvider:make
          gradle_retry ./gradlew WowUncutProvider:make
          gradle_retry ./gradlew onetv:make
          gradle_retry ./gradlew FreeVideos:make
          gradle_retry ./gradlew FullTo:make
          gradle_retry ./gradlew VippornsProvider:make
          gradle_retry ./gradlew makePluginsJson
          
          mkdir -p build_output
          cp HamsterProvider/build/*.cs3 build_output/ || true
          cp ViralLinksProvider/build/*.cs3 build_output/ || true
          cp WowProvider/build/*.cs3 build_output/ || true
          cp WowUncutProvider/build/*.cs3 build_output/ || true
          cp onetv/build/*.cs3 build_output/ || true
          cp FreeVideos/build/*.cs3 build_output/ || true
          cp FullTo/build/*.cs3 build_output/ || true
          cp VippornsProvider/build/*.cs3 build_output/ || true
          cp build/plugins.json build_output/plugins.json
          
          echo '{
            "name": "NSFW Providers",
            "iconUrl": "https://raw.githubusercontent.com/cosmix-extensions/test222/refs/heads/main/assets/icons/Fliex.png",
            "description": "NSFW Extensions for CloudStream",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/cosmix-extensions/test222/builds/plugins.json"
            ]
          }' > build_output/repo.json

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build_output
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
          
